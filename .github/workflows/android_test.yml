name: Android Testing

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Also validates the Gradle wrapper checksum and caches Gradle dependencies.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, lint, and run unit tests
        run: ./gradlew build

      - name: Verify publication (as JitPack does)
        run: ./gradlew publishToMavenLocal

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always() # This ensures that test results are uploaded even if a test step fails
        with:
          name: test-results
          path: |
            **/build/test-results/
            **/build/outputs/androidTest-results/connected/
            **/build/reports/
